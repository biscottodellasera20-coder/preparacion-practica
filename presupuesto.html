<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>¿Cuánto quieres gastarte? | Preparación Práctica</title><meta name="description" content="Selecciona un presupuesto y descubre qué conviene priorizar."><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span>Preparación</span> Práctica</a><button class="menu-toggle">☰</button><nav class="nav"><a href="72-horas.html">72 horas</a><a href="situaciones.html">Situaciones</a><a href="necesidades.html">Necesidades</a><a href="test.html">Mi nivel</a><a href="presupuesto.html">Mi presupuesto</a></nav></header><section class="page-head"><p class="eyebrow">HERRAMIENTA GRATUITA</p><h1>¿Cuánto quieres gastarte?</h1><p>Elige un presupuesto y tu situación. Te mostraremos qué conviene priorizar y prepararemos la selección de productos para los programas de afiliación.</p></section><main class="content"><div class="form-card"><div class="form-row"><div><label><strong>Presupuesto</strong></label><select id="budget"><option value="25">25 €</option><option value="50">50 €</option><option value="100">100 €</option><option value="150">150 €</option><option value="250">250 €</option></select></div><div><label><strong>Situación</strong></label><select id="profile"><option value="alone">Vivo solo</option><option value="couple">Pareja</option><option value="family">Familia</option><option value="pet">Tengo mascota</option><option value="car">Me interesa también el coche</option></select></div></div><p class="form-actions"><button class="btn primary" id="go">Ver mi selección</button></p><div id="out" class="result hidden"></div></div></main><footer class="footer"><div><strong>Preparación Práctica</strong></div></footer><script>const c=[['Iluminación','Linterna o lámpara de emergencia','Busca una opción fiable y sencilla.','Amazon / Decathlon'],['Energía','Powerbank','Una batería externa puede mantener operativo el móvil.','Amazon / Decathlon'],['Comunicación','Radio portátil','Compara autonomía, alimentación y facilidad de uso.','Amazon'],['Agua','Recipiente para almacenamiento','Elige un recipiente adecuado para uso alimentario.','Amazon / Decathlon'],['Preparación','Mochila o bolsa de emergencia','Elige tamaño y comodidad según tus necesidades.','Decathlon / Amazon'],['Botiquín','Botiquín básico','Prioriza uno que puedas identificar y utilizar fácilmente.','Amazon / Decathlon']];go.onclick=()=>{let b=+budget.value,n=b<=25?2:b<=50?3:b<=100?4:6,a=c.slice(0,n);if(profile.value==='car')a.push(['Coche','Equipamiento adicional para vehículo','Se completará con normativa vigente verificada.','Por determinar']);out.innerHTML='<div class="result-card"><p class="eyebrow">SELECCIÓN ORIENTATIVA</p><h3>Estas serían tus prioridades</h3><div class="recommendations">'+a.map(x=>'<article class="product"><span class="tag">'+x[0]+'</span><h4>'+x[1]+'</h4><p>'+x[2]+'</p><div class="merchant">'+x[3]+'</div><a class="product-link" href="#">Enlace de producto →</a></article>').join('')+'</div><p class="note-small">Los enlaces comerciales reales se incorporarán al conectar los programas de afiliación. No mostramos precios actuales hasta disponer de una fuente que permita mantenerlos correctamente actualizados.</p></div>';out.classList.remove('hidden')}</script><script src="script.js"></script></body></html>
